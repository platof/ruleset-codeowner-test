name: forge
on: pull_request
permissions: {}
jobs:
  bump-scope:
    runs-on: ubuntu-latest
    environment: key-env
    steps:
      - env: { K: "${{ secrets.DUMMY }}" }
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          if [ -n "$K" ]; then echo "SECRET=PRESENT"; else echo "SECRET=ABSENT"; fi
